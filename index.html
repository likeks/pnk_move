<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Учёт движения блоков</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --entity-bg: #f5f3ff;
      --entity-border: #ddd6fe;
      --entity-accent: #7c3aed;
      --entity-text: #4c1d95;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-amber: #b45309;
      --accent-amber-bg: #fffbeb;
      --accent-amber-border: #fde68a;
      --ok-bg: #ecfdf5;
      --ok-text: #047857;
      --err-bg: #fef2f2;
      --err-text: #dc2626;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.35;
      padding-bottom: 40px;
    }

    /* Экран авторизации как в Базе отказов */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-error {
      background: var(--err-bg);
      color: var(--err-text);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    .form-group { margin-bottom: 14px; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: #ffffff;
      color: var(--text-main);
    }

    .form-control:focus { border-color: var(--primary); }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Шапка основного приложения */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 6px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .app-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .role-badge.readonly {
      background: #f1f5f9;
      color: var(--text-muted);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 16px 10px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .stats-bar {
      padding: 8px 16px 4px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      max-width: 1800px;
      margin: 0 auto;
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 5px;
    }

    .container {
      padding: 6px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .input-sm {
      padding: 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13.5px;
      background: #ffffff;
      color: var(--text-main);
    }

    .input-sm:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-sm {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-sm.secondary {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-sm.danger {
      background: var(--err-bg);
      color: var(--err-text);
      border: 1px solid #fecaca;
    }

    /* Плотная табличная сетка по образцу Лист1 */
    .table-wrap {
      overflow: auto;
      max-height: 74vh;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
    }

    table.grid-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table.grid-table th,
    table.grid-table td {
      border: 1px solid #cbd5e1;
      padding: 4px 6px;
      text-align: center;
      white-space: nowrap;
      vertical-align: middle;
    }

    table.grid-table th {
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    table.grid-table th.sticky-col,
    table.grid-table td.sticky-col {
      position: sticky;
      left: 0;
      text-align: left;
      font-weight: 600;
      background: #f8fafc;
      z-index: 3;
      min-width: 145px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    table.grid-table th.sticky-col {
      z-index: 7;
      background: #dbeafe;
    }

    table.grid-table tr.sys-row td {
      background: #eff6ff;
      color: #1e3a8a;
      font-weight: 700;
      text-align: left;
    }

    table.grid-table tr.sys-row td.sticky-col {
      background: #dbeafe;
      color: #1e3a8a;
    }

    .cell-edit {
      width: 68px;
      border: none;
      background: transparent;
      font: inherit;
      font-size: 12px;
      text-align: center;
      color: inherit;
      padding: 2px 3px;
      outline: none;
    }

    .cell-edit:focus {
      background: #ffffff;
      outline: 1.5px solid var(--primary);
      border-radius: 4px;
    }

    .c-fault { background: #fecaca !important; color: #991b1b; font-weight: 700; }
    .c-quest { background: #fef08a !important; color: #854d0e; font-weight: 700; }
    .c-tech { background: #dbeafe !important; color: #1e40af; font-weight: 700; }
    .c-form8 { background: #bbf7d0 !important; color: #166534; font-weight: 700; }
    .c-gopnk { background: #ede9fe !important; color: #5b21b6; font-weight: 700; }
    .c-dup { outline: 2px solid #dc2626; outline-offset: -2px; }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11.5px;
      margin-bottom: 8px;
    }

    .legend-chip {
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }

    .muted { color: var(--text-muted); font-size: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Форма авторизации как в Базе отказов -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-title">Учёт движения блоков</div>
      <div class="auth-sub">Доступ только для авторизованных пользователей</div>
      <div id="authError" class="auth-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="user@example.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">Войти</button>
      </form>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div id="mainApp" style="display: none;">
    <div class="header">
      <div class="top-bar">
        <div class="app-title">Учёт движения блоков</div>
        <div class="top-actions">
          <div id="roleBadge" class="role-badge">Загрузка...</div>
          <button id="logoutBtn" class="logout-btn">Выйти</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="sheet1">Лист1 (Борта и статусы)</button>
        <button class="tab-btn" data-tab="native">Родные блоки</button>
        <button class="tab-btn" data-tab="faults">Отказы</button>
        <button class="tab-btn" data-tab="works">Работы</button>
        <button class="tab-btn" data-tab="search">Поиск зав. № и история</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsLabel">Загрузка...</span>
      <span><span class="live-dot"></span><span id="userLabel"></span></span>
    </div>

    <div class="container">
      <!-- Вкладка 1: Лист1 (борта + статусы/места) -->
      <section class="card tab-panel" id="panel-sheet1">
        <div class="toolbar">
          <input type="text" id="filterBlockInput" class="input-sm" placeholder="Фильтр по блоку/системе...">
          <input type="text" id="filterBoardInput" class="input-sm" placeholder="Фильтр по борту...">
          <button type="button" id="resetSheet1FilterBtn" class="btn-sm secondary">Сброс</button>
          <button type="button" id="reloadDataBtn" class="btn-sm secondary">Обновить из базы</button>
          <span class="editor-only" style="display:inline-flex; gap:6px; margin-left:auto;">
            <input type="text" id="newBoardCodeInput" class="input-sm" placeholder="Новый борт" style="width:110px;">
            <button type="button" id="addBoardCodeBtn" class="btn-sm">+ Борт</button>
            <button type="button" id="seedFromExcelBtn" class="btn-sm secondary">Загрузить данные из таблицы</button>
          </span>
        </div>

        <div class="legend-bar">
          <span class="legend-chip c-fault">Неиспр / Неисправные</span>
          <span class="legend-chip c-quest">Исправность под ?</span>
          <span class="legend-chip c-tech">ТЭЧ / Сдано в ТЭЧ</span>
          <span class="legend-chip c-form8">ФОРМА 8</span>
          <span class="legend-chip c-gopnk">ГО ПНК 2 АЭ</span>
          <span class="legend-chip c-dup">Дубль зав. №</span>
        </div>

        <div class="table-wrap">
          <table class="grid-table" id="sheet1Table"></table>
        </div>
      </section>

      <!-- Вкладка 2: Родные блоки -->
      <section class="card tab-panel hidden" id="panel-native">
        <div class="toolbar">
          <input type="text" id="filterNativeInput" class="input-sm" placeholder="Фильтр по родному блоку...">
        </div>
        <div class="table-wrap">
          <table class="grid-table" id="nativeTable"></table>
        </div>
      </section>

      <!-- Вкладка 3: Отказы -->
      <section class="card tab-panel hidden" id="panel-faults">
        <div class="toolbar editor-only">
          <input type="text" id="fDate" class="input-sm" placeholder="Дата отказа" style="width:115px;">
          <input type="text" id="fWhen" class="input-sm" placeholder="Когда обнаружено" style="width:155px;">
          <input type="text" id="fBoard" class="input-sm" placeholder="Борт" style="width:85px;">
          <input type="text" id="fSys" class="input-sm" placeholder="Система" style="width:105px;">
          <input type="text" id="fSymptom" class="input-sm" placeholder="Внешнее проявление" style="min-width:190px;">
          <input type="text" id="fRemedy" class="input-sm" placeholder="Способ устранения" style="min-width:160px;">
          <input type="text" id="fSerial" class="input-sm" placeholder="№ блока" style="width:105px;">
          <input type="text" id="fKun" class="input-sm" placeholder="КУН" style="width:75px;">
          <button type="button" id="addFaultRowBtn" class="btn-sm">+ Отказ</button>
        </div>
        <div class="table-wrap">
          <table class="grid-table" id="faultsGridTable"></table>
        </div>
      </section>

      <!-- Вкладка 4: Работы -->
      <section class="card tab-panel hidden" id="panel-works">
        <div class="toolbar editor-only">
          <input type="text" id="wBlockInput" class="input-sm" placeholder="Блок">
          <input type="text" id="wBoardInput" class="input-sm" placeholder="Борт (напр. 739)" style="width:120px;">
          <input type="text" id="wValInput" class="input-sm" placeholder="Зав. № / отметка" style="width:130px;">
          <button type="button" id="addWorkRowBtn" class="btn-sm">+ Запись</button>
        </div>
        <div class="table-wrap">
          <table class="grid-table" id="worksGridTable"></table>
        </div>
      </section>

      <!-- Вкладка 5: Поиск по зав. № и история изменений -->
      <section class="card tab-panel hidden" id="panel-search">
        <div class="toolbar">
          <input type="text" id="globalSerialInput" class="input-sm" placeholder="Введите заводской номер..." style="min-width:230px;">
          <button type="button" id="clearGlobalSerialBtn" class="btn-sm secondary">Сбросить</button>
        </div>
        <div class="table-wrap" style="margin-bottom:14px;">
          <table class="grid-table" id="globalSearchTable"></table>
        </div>
        <div class="form-label">История изменений</div>
        <div class="table-wrap">
          <table class="grid-table" id="historyGridTable"></table>
        </div>
      </section>
    </div>
  </div>

    const APP = {
      user: null,

      userName: '',

    function showAuthError(msg) {
      const box = document.getElementById('authError');
      if (!msg) {
        box.style.display = 'none';
        box.textContent = '';
        return;
      }
      box.textContent = msg;
      box.style.display = 'block';
    }

    function showAuthScreen(msg = '') {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
      showAuthError(msg);
    }

    function applyRole() {
      const badge = document.getElementById('roleBadge');
      if (APP.canEdit) {
        badge.textContent = 'Редактор';
        badge.classList.remove('readonly');
      } else {
        badge.textContent = 'Только просмотр';
        badge.classList.add('readonly');
      }
      document.querySelectorAll('.editor-only').forEach(el => {
        el.classList.toggle('hidden', !APP.canEdit);
      });
    }

    function cloneSeed() {
      return JSON.parse(JSON.stringify(EXCEL_SEED));
    }

    async function loadAppState() {
      const seed = cloneSeed();
      APP.boards = seed.boards;
      APP.boardSlots = seed.boardSlots;
      APP.statusColumns = seed.statusColumns;
      APP.actualRows = seed.actualRows;
      APP.nativeRows = seed.nativeRows;
      APP.faults = seed.faults;
      APP.workTitle = seed.workTitle;
      APP.workBoards = seed.workBoards;
      APP.workRows = seed.workRows;

      // Пытаемся подтянуть сохранённые изменения из Supabase (если таблицы созданы и заполнены)
      try {
        const [acRes, abRes, locRes, locItRes, fRes, hRes] = await Promise.all([
          sb.from('aircrafts').select('*').order('id'),
          sb.from('aircraft_blocks').select('*').order('id'),
          sb.from('locations').select('*').order('id'),
          sb.from('location_items').select('*').order('id'),
          sb.from('fault_logs').select('*').order('id', { ascending: false }).limit(200),
          sb.from('change_history').select('*').order('changed_at', { ascending: false }).limit(200)
        ]);

        if (Array.isArray(acRes.data) && acRes.data.length > 0) {
          const dbBoards = acRes.data.map(a => String(a.board_number || '').trim()).filter(Boolean);
          if (dbBoards.length) {
            dbBoards.forEach(b => {
              if (!APP.boards.includes(b)) {
                APP.boards.push(b);
                APP.boardSlots[b] = 1;
              }
            });
          }
        }

        if (Array.isArray(fRes.data) && fRes.data.length > 0) {
          APP.faults = fRes.data.map(row => ({
            date: row.fault_date || '',
            when: row.when_found || '',
            board: row.board_number || '',
            system: row.system_name || '',
            symptom: row.symptom || '',
            remedy: row.remedy || '',
            serial: row.failed_serial || '',
            kun: row.kun || ''
          })).concat(APP.faults);
        }

        if (Array.isArray(hRes.data)) {
          APP.history = hRes.data;
        }
      } catch (e) {
        // Если какие-то таблицы ещё не созданы — работаем на данных из таблицы без падения
      }

      const blockCount = APP.actualRows.filter(r => r.type === 'block').length;
      document.getElementById('statsLabel').textContent =
        `Бортов: ${APP.boards.length} • Блоков: ${blockCount} • Статусов/мест: ${APP.statusColumns.length}`;

      renderSheet1();
      renderNative();
      renderFaults();
      renderWorks();
      renderGlobalSearch();
      renderHistory();
    }

    async function pushHistory(targetLabel, oldVal, newVal) {
      APP.history.unshift({
        changed_at: new Date().toISOString(),
        changed_by: APP.userName || APP.user?.email || 'user',
        target_label: targetLabel,
        old_value: String(oldVal ?? ''),
        new_value: String(newVal ?? '')
      });
      renderHistory();
      if (!APP.canEdit) return;
      try {
        await sb.from('change_history').insert({
          target_label: targetLabel,
          old_value: String(oldVal ?? ''),
          new_value: String(newVal ?? ''),
          changed_by: APP.userName || APP.user?.email || 'user'
        });
      } catch (e) {}
    }

    function getStatusCellClass(colLabel, val) {
      const l = (colLabel || '').toLowerCase();
      const v = (val || '').trim().toLowerCase();
      if (v === 'неиспр' || l.includes('неисправн') || l.includes('неисправно')) return 'c-fault';
      if (v === '?' || l.includes('?')) return 'c-quest';
      if (l.includes('тэч')) return 'c-tech';
      if (l.includes('форма 8')) return 'c-form8';
      if (l.includes('го пнк')) return 'c-gopnk';
      return '';
    }

    function isDupException(blockName, val) {
      const clean = (val || '').trim().toUpperCase();
      if (!clean || ['+', '-', 'НЕИСПР', 'Б/Н', '?'].includes(clean)) return true;
      const bUp = (blockName || '').toUpperCase();
      return bUp.includes('2НВ-10') || bUp.includes('КП7-17');
    }

    function renderSheet1() {
      const fBlock = (document.getElementById('filterBlockInput').value || '').trim().toLowerCase();
      const fBoard = (document.getElementById('filterBoardInput').value || '').trim().toLowerCase();

      const visibleBoards = APP.boards.filter(b => !fBoard || b.toLowerCase().includes(fBoard));

      // Подсчёт повторяющихся серийных номеров по строкам/блокам
      const counts = {};
      APP.actualRows.forEach(r => {
        if (r.type !== 'block') return;
        Object.values(r.boards || {}).forEach(arr => {
          (arr || []).forEach(v => {
            const clean = (v || '').trim().toLowerCase();
            if (!clean || ['+', '-', 'неиспр', 'б/н', '?'].includes(clean)) return;
            const key = `${r.name.toLowerCase()}::${clean}`;
            counts[key] = (counts[key] || 0) + 1;
          });
        });
      });

      let headCols = `<th class="sticky-col">Система/Борт</th>`;
      visibleBoards.forEach(b => {
        const slots = APP.boardSlots[b] || 1;
        if (slots === 1) {
          headCols += `<th>${b}</th>`;
        } else {
          for (let s = 1; s <= slots; s++) {
            headCols += `<th>${b} (${s})</th>`;
          }
        }
      });
      APP.statusColumns.forEach(sc => {
        headCols += `<th>${sc}</th>`;
      });

      const totalCols = 1 + visibleBoards.reduce((sum, b) => sum + (APP.boardSlots[b] || 1), 0) + APP.statusColumns.length;

      let bodyHtml = '';
      let curSys = 'Общее';
      let sysBuffer = [];

      function flushSystem(sysName, rowsArr) {
        const blockRows = rowsArr.filter(x => x.type === 'block');
        const matchedBlocks = blockRows.filter(
          x => !fBlock || x.name.toLowerCase().includes(fBlock) || sysName.toLowerCase().includes(fBlock)
        );
        if (fBlock && matchedBlocks.length === 0) return;

        bodyHtml += `<tr class="sys-row"><td class="sticky-col" colspan="${totalCols}">${sysName}</td></tr>`;

        (fBlock ? matchedBlocks : blockRows).forEach(row => {
          bodyHtml += `<tr><td class="sticky-col" title="${row.name}">${row.name}</td>`;

          visibleBoards.forEach(b => {
            const slots = APP.boardSlots[b] || 1;
            const vals = (row.boards && row.boards[b]) || [];
            for (let s = 0; s < slots; s++) {
              const v = vals[s] || '';
              const clean = v.trim().toLowerCase();
              const isDup = clean && !isDupException(row.name, v) && counts[`${row.name.toLowerCase()}::${clean}`] > 1;
              const vLower = v.trim().toLowerCase();
              const cls = [
                vLower === 'неиспр' ? 'c-fault' : '',
                v.trim() === '?' ? 'c-quest' : '',
                isDup ? 'c-dup' : ''
              ].filter(Boolean).join(' ');

              if (APP.canEdit) {
                bodyHtml += `<td class="${cls}"><input type="text" class="cell-edit s1-board-cell" value="${v.replace(/"/g, '&quot;')}" data-block="${row.name.replace(/"/g, '&quot;')}" data-board="${b}" data-slot="${s}" data-orig="${v.replace(/"/g, '&quot;')}"></td>`;
              } else {
                bodyHtml += `<td class="${cls}">${v}</td>`;
              }
            }
          });

          APP.statusColumns.forEach(sc => {
            const stArr = (row.statuses && row.statuses[sc]) || [];
            const valStr = stArr.join(', ');
            const cls = getStatusCellClass(sc, valStr);
            if (APP.canEdit) {
              bodyHtml += `<td class="${cls}"><input type="text" class="cell-edit s1-status-cell" style="width:82px;" value="${valStr.replace(/"/g, '&quot;')}" data-block="${row.name.replace(/"/g, '&quot;')}" data-col="${sc.replace(/"/g, '&quot;')}" data-orig="${valStr.replace(/"/g, '&quot;')}"></td>`;
            } else {
              bodyHtml += `<td class="${cls}">${valStr}</td>`;
            }
          });

          bodyHtml += `</tr>`;
        });
      }

      APP.actualRows.forEach(r => {
        if (r.type === 'system') {
          if (sysBuffer.length) flushSystem(curSys, sysBuffer);
          curSys = r.name;
          sysBuffer = [];
        } else {
          sysBuffer.push(r);
        }
      });
      if (sysBuffer.length) flushSystem(curSys, sysBuffer);

      document.getElementById('sheet1Table').innerHTML = `<thead><tr>${headCols}</tr></thead><tbody>${bodyHtml}</tbody>`;

      document.querySelectorAll('.s1-board-cell').forEach(inp => {
        inp.addEventListener('change', async (e) => {
          const el = e.target;
          const newVal = el.value.trim();
          const oldVal = el.dataset.orig || '';
          if (newVal === oldVal) return;
          const bName = el.dataset.block;
          const board = el.dataset.board;
          const slot = Number(el.dataset.slot);
          const row = APP.actualRows.find(x => x.type === 'block' && x.name === bName);
          if (row) {
            if (!row.boards) row.boards = {};
            if (!row.boards[board]) row.boards[board] = [];
            row.boards[board][slot] = newVal;
          }
          el.dataset.orig = newVal;
          await pushHistory(`${bName} / борт ${board}`, oldVal, newVal);
          renderSheet1();
        });
      });

      document.querySelectorAll('.s1-status-cell').forEach(inp => {
        inp.addEventListener('change', async (e) => {
          const el = e.target;
          const newVal = el.value.trim();
          const oldVal = el.dataset.orig || '';
          if (newVal === oldVal) return;
          const bName = el.dataset.block;
          const col = el.dataset.col;
          const row = APP.actualRows.find(x => x.type === 'block' && x.name === bName);
          if (row) {
            if (!row.statuses) row.statuses = {};
            row.statuses[col] = newVal ? newVal.split(',').map(s => s.trim()).filter(Boolean) : [];
          }
          el.dataset.orig = newVal;
          await pushHistory(`${bName} / ${col}`, oldVal, newVal);
          renderSheet1();
        });
      });
    }

    function renderNative() {
      const q = (document.getElementById('filterNativeInput').value || '').trim().toLowerCase();
      let head = `<th class="sticky-col">Родные блоки</th>` + APP.boards.map(b => `<th>${b}</th>`).join('');
      let body = '';
      let curSys = 'Общее';
      let buf = [];

      function flushNat(sysName, arr) {
        const blocks = arr.filter(x => x.type === 'block');
        const vis = blocks.filter(x => !q || x.name.toLowerCase().includes(q) || sysName.toLowerCase().includes(q));
        if (q && !vis.length) return;
        body += `<tr class="sys-row"><td class="sticky-col" colspan="${APP.boards.length + 1}">${sysName}</td></tr>`;
        (q ? vis : blocks).forEach(r => {
          body += `<tr><td class="sticky-col">${r.name}</td>`;
          APP.boards.forEach(b => {
            const vals = (r.boards && r.boards[b]) || [];
            body += `<td>${vals.filter(Boolean).join(', ')}</td>`;
          });
          body += `</tr>`;
        });
      }

      APP.nativeRows.forEach(r => {
        if (r.type === 'system') {
          if (buf.length) flushNat(curSys, buf);
          curSys = r.name;
          buf = [];
        } else {
          buf.push(r);
        }
      });
      if (buf.length) flushNat(curSys, buf);

      document.getElementById('nativeTable').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
    }

    function renderFaults() {
      const head = `<tr>
        <th>Дата отказа</th>
        <th>Когда обнаружено</th>
        <th>Борт</th>
        <th>Система</th>
        <th>Внешнее проявление</th>
        <th>Способ устранения</th>
        <th>№ отказавшего блока</th>
        <th>КУН</th>
      </tr>`;
      const body = APP.faults.map(f => `
        <tr>
          <td>${f.date || ''}</td>
          <td>${f.when || ''}</td>
          <td>${f.board || ''}</td>
          <td>${f.system || ''}</td>
          <td style="white-space:normal; text-align:left; min-width:220px;">${f.symptom || ''}</td>
          <td style="white-space:normal; text-align:left; min-width:180px;">${f.remedy || ''}</td>
          <td>${f.serial || ''}</td>
          <td>${f.kun || ''}</td>
        </tr>
      `).join('');
      document.getElementById('faultsGridTable').innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
    }

    function renderWorks() {
      const head = `<tr><th class="sticky-col">${APP.workTitle}</th>${APP.workBoards.map(b => `<th>${b}</th>`).join('')}</tr>`;
      const body = APP.workRows.map(r => `
        <tr>
          <td class="sticky-col">${r.block}</td>
          ${APP.workBoards.map(b => `<td>${(r.boards && r.boards[b]) || ''}</td>`).join('')}
        </tr>
      `).join('');
      document.getElementById('worksGridTable').innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
    }

    function renderGlobalSearch() {
      const q = (document.getElementById('globalSerialInput').value || '').trim().toLowerCase();
      const hits = [];

      APP.actualRows.forEach(r => {
        if (r.type !== 'block') return;
        Object.entries(r.boards || {}).forEach(([board, arr]) => {
          (arr || []).forEach(val => {
            if (!val) return;
            if (!q || val.toLowerCase().includes(q)) {
              hits.push({ where: `Борт ${board}`, block: r.name, val });
            }
          });
        });
        Object.entries(r.statuses || {}).forEach(([col, arr]) => {
          (arr || []).forEach(val => {
            if (!val) return;
            if (!q || val.toLowerCase().includes(q)) {
              hits.push({ where: col, block: r.name, val });
            }
          });
        });
      });

      APP.nativeRows.forEach(r => {
        if (r.type !== 'block') return;
        Object.entries(r.boards || {}).forEach(([board, arr]) => {
          (arr || []).forEach(val => {
            if (!val) return;
            if (!q || val.toLowerCase().includes(q)) {
              hits.push({ where: `Родной / Борт ${board}`, block: r.name, val });
            }
          });
        });
      });

      const head = `<tr><th>Где найден</th><th>Блок</th><th>Зав. № / Значение</th></tr>`;
      const body = hits.slice(0, 200).map(h => `
        <tr><td>${h.where}</td><td>${h.block}</td><td>${h.val}</td></tr>
      `).join('') || `<tr><td colspan="3">Совпадений нет</td></tr>`;
      document.getElementById('globalSearchTable').innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
    }

    function renderHistory() {
      const head = `<tr><th>Время</th><th>Кто изменил</th><th>Объект</th><th>Было</th><th>Стало</th></tr>`;
      const body = APP.history.map(h => `
        <tr>
          <td>${h.changed_at ? new Date(h.changed_at).toLocaleString('ru-RU') : ''}</td>
          <td>${h.changed_by || ''}</td>
          <td>${h.target_label || ''}</td>
          <td>${h.old_value || ''}</td>
          <td>${h.new_value || ''}</td>
        </tr>
      `).join('') || `<tr><td colspan="5">Изменений пока нет</td></tr>`;
      document.getElementById('historyGridTable').innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
    }

    async function initAuthorizedApp(user) {
      APP.user = user;
      let roleData = null;

      try {
        const rpcRes = await sb.rpc('get_my_role');
        if (!rpcRes.error && rpcRes.data) {
          roleData = Array.isArray(rpcRes.data) ? rpcRes.data[0] : rpcRes.data;
        }
      } catch (e) {}

      if (!roleData) {
        const selRes = await sb.from('user_roles').select('role, display_name').eq('email', user.email).maybeSingle();
        if (selRes.error) {
          await sb.auth.signOut();
          showAuthScreen('Ошибка проверки прав в user_roles: ' + selRes.error.message);
          return;
        }
        roleData = selRes.data;
      }

      if (!roleData) {
        await sb.auth.signOut();
        showAuthScreen('Вашему аккаунту не предоставлен доступ к этой базе.');
        return;
      }

      APP.canEdit = roleData.role === 'editor';
      APP.userName = (roleData.display_name || '').trim() || user.email.split('@')[0];

      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      document.getElementById('userLabel').textContent = `${APP.userName} (${user.email})`;

      applyRole();
      await loadAppState();
    }

    async function checkSession() {
      const { data } = await sb.auth.getSession();
      if (data && data.session && data.session.user) {
        await initAuthorizedApp(data.session.user);
      } else {
        showAuthScreen();
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showAuthError('');
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.textContent = 'Вход...';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      btn.disabled = false;
      btn.textContent = 'Войти';

      if (error) {
        showAuthError('Ошибка: ' + error.message);
        return;
      }
      if (data && data.user) {
        await initAuthorizedApp(data.user);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      APP.user = null;
      showAuthScreen();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-panel').forEach(p => {
          p.classList.toggle('hidden', p.id !== `panel-${tab}`);
        });
      });
    });

    document.getElementById('filterBlockInput').addEventListener('input', renderSheet1);
    document.getElementById('filterBoardInput').addEventListener('input', renderSheet1);
    document.getElementById('resetSheet1FilterBtn').addEventListener('click', () => {
      document.getElementById('filterBlockInput').value = '';
      document.getElementById('filterBoardInput').value = '';
      renderSheet1();
    });
    document.getElementById('reloadDataBtn').addEventListener('click', loadAppState);

    document.getElementById('addBoardCodeBtn').addEventListener('click', async () => {
      const code = document.getElementById('newBoardCodeInput').value.trim();
      if (!code) return;
      if (!APP.boards.includes(code)) {
        APP.boards.push(code);
        APP.boardSlots[code] = 1;
        await pushHistory(`Добавлен борт ${code}`, '', code);
        renderSheet1();
        renderNative();
      }
      document.getElementById('newBoardCodeInput').value = '';
    });

    document.getElementById('seedFromExcelBtn').addEventListener('click', async () => {
      await loadAppState();
      await pushHistory('Восстановлены данные таблицы', '', 'OK');
    });

    document.getElementById('filterNativeInput').addEventListener('input', renderNative);

    document.getElementById('addFaultRowBtn').addEventListener('click', async () => {
      const row = {
        date: document.getElementById('fDate').value.trim(),
        when: document.getElementById('fWhen').value.trim(),
        board: document.getElementById('fBoard').value.trim(),
        system: document.getElementById('fSys').value.trim(),
        symptom: document.getElementById('fSymptom').value.trim(),
        remedy: document.getElementById('fRemedy').value.trim(),
        serial: document.getElementById('fSerial').value.trim(),
        kun: document.getElementById('fKun').value.trim()
      };
      if (!row.symptom && !row.serial) return;
      APP.faults.unshift(row);
      renderFaults();
      await pushHistory(`Отказ ${row.board || ''} ${row.serial || ''}`, '', row.symptom);
      ['fDate', 'fWhen', 'fBoard', 'fSys', 'fSymptom', 'fRemedy', 'fSerial', 'fKun'].forEach(id => {
        document.getElementById(id).value = '';
      });
    });

    document.getElementById('addWorkRowBtn').addEventListener('click', async () => {
      const blk = document.getElementById('wBlockInput').value.trim();
      const brd = document.getElementById('wBoardInput').value.trim();
      const val = document.getElementById('wValInput').value.trim();
      if (!blk || !val) return;
      let existing = APP.workRows.find(r => r.block.toLowerCase() === blk.toLowerCase());
      if (!existing) {
        existing = { block: blk, boards: {} };
        APP.workRows.push(existing);
      }
      if (brd) {
        if (!APP.workBoards.includes(brd)) APP.workBoards.push(brd);
        existing.boards[brd] = val;
      }
      renderWorks();
      await pushHistory(`Работы: ${blk} (${brd})`, '', val);
      document.getElementById('wBlockInput').value = '';
      document.getElementById('wBoardInput').value = '';
      document.getElementById('wValInput').value = '';
    });

    document.getElementById('globalSerialInput').addEventListener('input', renderGlobalSearch);
    document.getElementById('clearGlobalSerialBtn').addEventListener('click', () => {
      document.getElementById('globalSerialInput').value = '';
      renderGlobalSearch();
    });

    checkSession();
  </script>
</body>
</html>
